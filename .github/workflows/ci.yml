name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `astro check` covers TypeScript plus the .astro templates, which is what
      # replaced ESLint when the site moved off Next.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
