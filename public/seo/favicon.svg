<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Monochrome, and deliberately not the accent. At 16px a favicon has one job:
    be recognisable in a strip of other tabs. #0D1220 is the site's own black —
    the same value the header bar uses — so the tab icon and the top of the page
    read as one thing, and white on it measures 18.68:1.

    Two colours, no border: the acid-green original had a 12px inner stroke that
    turned to mush at tab size, and the letterform has grown into that space.
  -->
  <rect width="180" height="180" rx="32" fill="#0D1220" />
  <g fill="#fff">
    <rect x="44" y="42" width="26" height="96" />
    <rect x="110" y="42" width="26" height="96" />
    <rect x="44" y="77" width="92" height="26" />
  </g>
</svg>
