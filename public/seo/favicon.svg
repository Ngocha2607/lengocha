<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Violet ground, white glyph. The previous version was acid green with a black
    inner stroke; the stroke turned to mush at 16px, so it is gone and the
    letterform grew into the space it freed. White on #964BF1 measures 4.60:1.
  -->
  <rect width="180" height="180" rx="32" fill="#964BF1" />
  <g fill="#fff">
    <rect x="44" y="42" width="26" height="96" />
    <rect x="110" y="42" width="26" height="96" />
    <rect x="44" y="77" width="92" height="26" />
  </g>
</svg>
